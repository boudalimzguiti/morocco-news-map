<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a24">
  <meta name="description" content="Explore today's Morocco headlines on an interactive map.">
  <title>Morocco Live News Map</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://{s}.tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      color-scheme: light;
      --ink: #17251f;
      --muted: #6d7a73;
      --line: #e6ebe7;
      --paper: #fff;
      --canvas: #f3f6f3;
      --green: #176b4a;
      --green-dark: #102a24;
      --economy: #16835d;
      --politics: #7560cb;
      --sports: #e08024;
      --tech: #2780c2;
      --weather: #d35470;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { color: var(--ink); background: var(--canvas); overflow: hidden; }
    button, input, select { font: inherit; }
    .app { display: flex; flex-direction: column; width: 100%; height: 100%; }
    .topbar {
      z-index: 500; display: flex; align-items: center; justify-content: space-between; gap: 20px;
      min-height: 76px; padding: 12px 24px; color: white; background: var(--green-dark);
      box-shadow: 0 2px 12px #102a2426;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { display: grid; width: 40px; height: 40px; flex: 0 0 40px; place-items: center; border-radius: 12px; background: #ffffff18; color: #b9f1d0; }
    .brand-mark svg { width: 23px; height: 23px; }
    h1 { margin: 0; font-size: clamp(17px, 2vw, 21px); letter-spacing: -.025em; }
    .subtitle { margin: 3px 0 0; color: #bdccc3; font-size: 12px; }
    .updated { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; padding: 9px 12px; border: 1px solid #ffffff25; border-radius: 999px; background: #ffffff0d; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #6ee7a4; box-shadow: 0 0 0 3px #6ee7a426; }
    .updated-label { color: #bdccc3; font-size: 11px; }
    #last-updated { display: block; margin-top: 2px; font-size: 12px; font-weight: 650; }
    .workspace { position: relative; display: flex; flex: 1; min-height: 0; }
    .sidebar { z-index: 400; display: flex; width: 360px; flex: 0 0 360px; flex-direction: column; background: var(--paper); border-right: 1px solid var(--line); transition: width .25s ease, flex-basis .25s ease, transform .25s ease; }
    .sidebar.collapsed { width: 0; flex-basis: 0; overflow: hidden; border-right: 0; }
    .side-head { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
    .side-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .side-title { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .story-count { padding: 4px 8px; border-radius: 999px; background: #edf5ef; color: var(--green); font-size: 11px; font-weight: 700; }
    .filters { display: grid; gap: 9px; margin-top: 16px; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; top: 50%; left: 12px; width: 16px; height: 16px; color: #849189; transform: translateY(-50%); pointer-events: none; }
    .search, .category-select { width: 100%; height: 40px; border: 1px solid #dfe6e1; border-radius: 9px; outline: none; background: #fff; color: var(--ink); font-size: 13px; }
    .search { padding: 0 12px 0 37px; }
    .category-select { padding: 0 11px; }
    .search:focus, .category-select:focus { border-color: #69a98a; box-shadow: 0 0 0 3px #176b4a14; }
    .list-caption { margin: 17px 20px 10px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .story-list { flex: 1; overflow-y: auto; padding: 0 12px 18px; }
    .story-card { width: 100%; padding: 14px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: inherit; text-align: left; cursor: pointer; transition: background .16s ease, border-color .16s ease, transform .16s ease; }
    .story-card + .story-card { margin-top: 3px; }
    .story-card:hover { background: #f7faf7; }
    .story-card:focus-visible { outline: 3px solid #176b4a40; }
    .story-card.active { border-color: #d7e9dd; background: #f1f8f3; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 4px 8px; border-radius: 999px; font-size: 10px; font-weight: 750; line-height: 1.2; }
    .badge::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .badge.economy { color: var(--economy); background: #e8f5ee; }
    .badge.politics { color: var(--politics); background: #f0edfc; }
    .badge.sports { color: var(--sports); background: #fff2e4; }
    .badge.tech { color: var(--tech); background: #e9f4fc; }
    .badge.weather-society { color: var(--weather); background: #fcecf0; }
    .card-date { color: #849189; font-size: 10px; white-space: nowrap; }
    .card-title { display: block; font-size: 13px; font-weight: 700; line-height: 1.45; }
    .card-location { display: flex; align-items: center; gap: 5px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .card-location svg { width: 13px; height: 13px; }
    .empty-state { padding: 28px 14px; color: var(--muted); font-size: 13px; line-height: 1.5; text-align: center; }
    .map-area { position: relative; flex: 1; min-width: 0; }
    #map { position: absolute; inset: 0; background: #e7eee8; }
    .map-toggle { position: absolute; z-index: 450; top: 16px; left: 16px; display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid #e4e9e5; border-radius: 11px; background: #fff; color: var(--ink); box-shadow: 0 3px 14px #17251f18; cursor: pointer; }
    .map-toggle:hover { background: #f6f8f6; }
    .map-toggle svg { width: 19px; height: 19px; }
    .map-hint { position: absolute; z-index: 400; right: 16px; bottom: 17px; padding: 9px 12px; border: 1px solid #e7ebe8; border-radius: 9px; background: #ffffffed; color: #66736b; font-size: 11px; box-shadow: 0 2px 10px #17251f12; }
    .leaflet-container { font-family: inherit; }
    .news-pin { display: flex; width: 34px; height: 42px; align-items: flex-start; justify-content: center; filter: drop-shadow(0 3px 3px #17251f35); }
    .news-pin svg { width: 34px; height: 42px; overflow: visible; }
    .news-popup .leaflet-popup-content-wrapper { padding: 0; overflow: hidden; border-radius: 14px; box-shadow: 0 8px 28px #17251f24; }
    .news-popup .leaflet-popup-content { width: 290px !important; margin: 0; }
    .news-popup .leaflet-popup-tip { box-shadow: 0 3px 5px #17251f12; }
    .popup-card { padding: 17px; }
    .popup-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .popup-date { color: #849189; font-size: 10px; }
    .popup-title { margin: 11px 0 5px; font-size: 16px; line-height: 1.35; letter-spacing: -.02em; }
    .popup-city { color: var(--muted); font-size: 11px; }
    .popup-summary { margin: 12px 0 15px; color: #526057; font-size: 12px; line-height: 1.6; }
    .read-link { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 12px; border-radius: 8px; background: var(--green); color: #fff !important; font-size: 11px; font-weight: 700; text-decoration: none; }
    .read-link:hover { background: #10583d; }
    .read-link svg { width: 13px; height: 13px; }
    .popup-source { margin-top: 10px; color: #849189; font-size: 10px; }
    .load-error { margin: 14px; padding: 12px; border-radius: 9px; background: #fff1f0; color: #a63b33; font-size: 12px; line-height: 1.5; }
    @media (max-width: 700px) {
      .topbar { min-height: 66px; padding: 10px 14px; gap: 8px; }
      .brand { gap: 9px; }
      .brand-mark { width: 36px; height: 36px; flex-basis: 36px; }
      .subtitle { display: none; }
      .updated { padding: 7px 9px; gap: 7px; }
      .updated-label { font-size: 10px; }
      #last-updated { font-size: 10px; }
      .sidebar { position: absolute; inset: 0 auto 0 0; width: min(340px, calc(100vw - 48px)); max-width: 88vw; flex-basis: min(340px, calc(100vw - 48px)); box-shadow: 8px 0 24px #17251f18; }
      .sidebar.collapsed { width: 0; flex-basis: 0; }
      .side-head { padding-top: 20px; }
      .map-toggle { top: 12px; left: 12px; }
      .map-hint { right: 10px; bottom: 11px; max-width: 190px; text-align: center; }
    }
    @media (max-width: 380px) { .brand-mark { display: none; } h1 { font-size: 16px; } .updated { gap: 6px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.5" stroke="currentColor" stroke-width="1.8"/><path d="m9 16 3-2 3 2-3 2-3-2Z" fill="currentColor" opacity=".8"/></svg></div>
        <div><h1>Morocco Live News Map</h1><p class="subtitle">The stories shaping Morocco today</p></div>
      </div>
      <div class="updated" title="Timestamp supplied by news.json"><span class="live-dot" aria-hidden="true"></span><div><span class="updated-label">Last updated</span><span id="last-updated">Loading…</span></div></div>
    </header>
    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Today's news stories">
        <div class="side-head">
          <div class="side-title-row"><h2 class="side-title">Today in Morocco</h2><span class="story-count" id="story-count">0 stories</span></div>
          <div class="filters">
            <label class="search-wrap"><svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input class="search" id="search" type="search" placeholder="Search headlines…" aria-label="Search headlines"></label>
            <select class="category-select" id="category-filter" aria-label="Filter by category"><option value="all">All categories</option><option>Economy</option><option>Politics</option><option>Sports</option><option>Tech</option><option>Weather/Society</option></select>
          </div>
        </div>
        <p class="list-caption">Today's headlines</p>
        <div class="story-list" id="story-list" aria-live="polite"><div class="empty-state">Loading the latest stories…</div></div>
      </aside>
      <section class="map-area" aria-label="Interactive map of Morocco news">
        <button class="map-toggle" id="sidebar-toggle" type="button" aria-label="Hide story list" aria-expanded="true" title="Toggle story list"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <div id="map" role="application" aria-label="Map showing news stories across Morocco"></div>
        <div class="map-hint">Select a pin or headline to explore a story</div>
      </section>
    </div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (() => {
      'use strict';
      const COLORS = {
        Economy: '#16835d', Politics: '#7560cb', Sports: '#e08024',
        Tech: '#2780c2', 'Weather/Society': '#d35470'
      };
      const map = L.map('map', { zoomControl: false, scrollWheelZoom: true }).setView([31.7917, -7.0926], 6);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>'
      }).addTo(map);

      const sidebar = document.getElementById('sidebar');
      const list = document.getElementById('story-list');
      const search = document.getElementById('search');
      const categoryFilter = document.getElementById('category-filter');
      const markers = new Map();
      let articles = [];
      let activeId = null;

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
      const categoryClass = (category) => category === 'Weather/Society' ? 'weather-society' : String(category || '').toLowerCase().replace(/[^a-z0-9-]/g, '-');
      const formatDate = (value) => {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value || 'Date unavailable') : new Intl.DateTimeFormat(undefined, { year: 'numeric', month: 'short', day: 'numeric' }).format(date);
      };
      const safeUrl = (value) => {
        try { const url = new URL(value); return ['http:', 'https:'].includes(url.protocol) ? url.href : '#'; }
        catch { return '#'; }
      };
      const makeIcon = (category) => {
        const color = COLORS[category] || '#69766e';
        return L.divIcon({
          className: '',
          html: `<div class="news-pin"><svg viewBox="0 0 34 42" aria-hidden="true"><path d="M17 1.5C8.5 1.5 2 8 2 16.3c0 11.1 15 24.2 15 24.2s15-13.1 15-24.2C32 8 25.5 1.5 17 1.5Z" fill="${color}" stroke="white" stroke-width="2"/><circle cx="17" cy="16" r="5.1" fill="white"/></svg></div>`,
          iconSize: [34, 42], iconAnchor: [17, 40], popupAnchor: [0, -36]
        });
      };
      const popupHtml = (article) => {
        const category = escapeHtml(article.category || 'News');
        const url = safeUrl(article.url);
        const link = url === '#' ? '' : `<a class="read-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Read Full Story <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>`;
        return `<article class="popup-card"><div class="popup-top"><span class="badge ${categoryClass(article.category)}">${category}</span><span class="popup-date">${escapeHtml(formatDate(article.date))}</span></div><h3 class="popup-title">${escapeHtml(article.title)}</h3><div class="popup-city">${escapeHtml(article.city || 'Morocco')}</div><p class="popup-summary">${escapeHtml(article.summary)}</p>${link}<div class="popup-source">${escapeHtml(article.source_name || '')}</div></article>`;
      };
      const selectStory = (article) => {
        const marker = markers.get(String(article.id));
        if (!marker) return;
        activeId = String(article.id);
        document.querySelectorAll('.story-card').forEach((card) => card.classList.toggle('active', card.dataset.id === activeId));
        map.flyTo([Number(article.lat), Number(article.lng)], Math.max(map.getZoom(), 9), { duration: 0.75 });
        marker.openPopup();
        if (window.matchMedia('(max-width: 700px)').matches) setSidebar(false);
      };
      const renderStories = () => {
        const term = search.value.trim().toLocaleLowerCase();
        const category = categoryFilter.value;
        const filtered = articles.filter((article) =>
          (category === 'all' || article.category === category) &&
          (!term || `${article.title || ''} ${article.city || ''} ${article.summary || ''}`.toLocaleLowerCase().includes(term))
        );
        document.getElementById('story-count').textContent = `${filtered.length} ${filtered.length === 1 ? 'story' : 'stories'}`;
        list.innerHTML = filtered.length ? filtered.map((article) => `<button class="story-card${String(article.id) === activeId ? ' active' : ''}" type="button" data-id="${escapeHtml(article.id)}"><span class="card-meta"><span class="badge ${categoryClass(article.category)}">${escapeHtml(article.category || 'News')}</span><span class="card-date">${escapeHtml(formatDate(article.date))}</span></span><span class="card-title">${escapeHtml(article.title)}</span><span class="card-location"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.7"/></svg>${escapeHtml(article.city || 'Morocco')}</span></button>`).join('') : '<div class="empty-state">No stories match your search. Try another keyword or category.</div>';
        list.querySelectorAll('.story-card').forEach((card) => card.addEventListener('click', () => {
          const article = articles.find((item) => String(item.id) === card.dataset.id);
          if (article) selectStory(article);
        }));
        markers.forEach((marker, id) => {
          const article = articles.find((item) => String(item.id) === id);
          if (article && filtered.includes(article)) { if (!map.hasLayer(marker)) marker.addTo(map); }
          else if (map.hasLayer(marker)) marker.closePopup().remove();
        });
      };
      const setSidebar = (open) => {
        sidebar.classList.toggle('collapsed', !open);
        const toggle = document.getElementById('sidebar-toggle');
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Hide story list' : 'Show story list');
        window.setTimeout(() => map.invalidateSize(), 260);
      };

      document.getElementById('sidebar-toggle').addEventListener('click', () => setSidebar(sidebar.classList.contains('collapsed')));
      search.addEventListener('input', renderStories);
      categoryFilter.addEventListener('change', renderStories);

      fetch(`news.json?v=${Date.now()}`, { cache: 'no-store' })
        .then((response) => { if (!response.ok) throw new Error(`Could not load news.json (${response.status})`); return response.json(); })
        .then((data) => {
          const updated = new Date(data.last_updated);
          document.getElementById('last-updated').textContent = Number.isNaN(updated.getTime()) ? 'Unknown' : new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(updated);
          articles = Array.isArray(data.articles) ? data.articles.filter((item) => item && Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lng))) : [];
          articles.forEach((article) => {
            const marker = L.marker([Number(article.lat), Number(article.lng)], { icon: makeIcon(article.category), title: article.title || article.city || 'News story' });
            marker.bindPopup(popupHtml(article), { className: 'news-popup', maxWidth: 320, minWidth: 260 });
            marker.on('click', () => {
              activeId = String(article.id);
              document.querySelectorAll('.story-card').forEach((card) => card.classList.toggle('active', card.dataset.id === activeId));
            });
            markers.set(String(article.id), marker);
          });
          renderStories();
        })
        .catch((error) => {
          document.getElementById('last-updated').textContent = 'Unavailable';
          list.innerHTML = `<div class="load-error">${escapeHtml(error.message)}. Make sure this page is served over HTTP and news.json is available.</div>`;
          document.getElementById('story-count').textContent = '0 stories';
        });
    })();
  </script>
</body>
</html>
